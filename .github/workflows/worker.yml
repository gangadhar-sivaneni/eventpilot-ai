name: worker
on:
  schedule:
    - cron: "*/10 * * * *"  # event discovery every 10 minutes
    - cron: "17 */2 * * *"  # matching and email digests every 2 hours
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker              # never two runs at once (the DB job locks are the second line of defence)
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # full worldwide date and link validation can exceed one scan interval
    defaults:
      run:
        working-directory: worker
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Check configuration
        if: env.SUPABASE_URL == '' || env.SUPABASE_SECRET_KEY == ''
        run: echo "::notice title=Worker Paused::Set both SUPABASE_URL and SUPABASE_SECRET_KEY repository secrets to enable background runs."
      - uses: actions/setup-python@v5
        if: env.SUPABASE_URL != '' && env.SUPABASE_SECRET_KEY != ''
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - run: pip install -r requirements.txt pip-audit==2.10.1
        if: env.SUPABASE_URL != '' && env.SUPABASE_SECRET_KEY != ''
      - run: pytest -q
        if: env.SUPABASE_URL != '' && env.SUPABASE_SECRET_KEY != ''
      - run: python -m pip_audit -r requirements.txt
        if: env.SUPABASE_URL != '' && env.SUPABASE_SECRET_KEY != ''
      - run: python discovery.py
        if: env.SUPABASE_URL != '' && env.SUPABASE_SECRET_KEY != '' && (github.event_name != 'schedule' || github.event.schedule == '*/10 * * * *')
      - run: python match_users.py
        if: env.SUPABASE_URL != '' && env.SUPABASE_SECRET_KEY != '' && !cancelled() && (github.event_name != 'schedule' || github.event.schedule == '17 */2 * * *')
      - run: python notify.py
        if: env.SUPABASE_URL != '' && env.SUPABASE_SECRET_KEY != '' && !cancelled() && (github.event_name != 'schedule' || github.event.schedule == '17 */2 * * *')
      - run: python cleanup.py
        if: env.SUPABASE_URL != '' && env.SUPABASE_SECRET_KEY != '' && !cancelled()
